name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet test -c Release

      - run: dotnet publish src/Lapse.Cli -c Release -r ${{ matrix.rid }} -o publish

      - name: Package
        shell: bash
        run: |
          name="lapse-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          cd publish
          rm -f *.pdb *.dbg
          cp ../LICENSE ../README.md ../lapse.example.json .
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a "../$name.zip" . ; else tar -czf "../$name.tar.gz" . ; fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: lapse-*

  github-release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/lapse-${{ github.ref_name }}.spdx.json
          upload-artifact: false

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

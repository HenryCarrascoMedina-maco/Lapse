name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "src/**", ".github/workflows/pages.yml"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/configure-pages@v6

      - name: Build site
        run: |
          mkdir -p _site
          cp site/index.html _site/
          dotnet run site/demo-data.cs -- demo.json
          dotnet run --project src/Lapse.Cli -c Release -- report --from demo.json -o _site/demo.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
